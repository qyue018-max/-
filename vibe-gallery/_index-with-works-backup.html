<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vibe coding · 12 个用 AI 写出来的网页</title>
<style>
  :root{
    --paper:#fbf7ef;
    --paper-edge:#e9dfcd;
    --bg1:#f2ece1;
    --bg2:#e3d9c7;
    --ink:#2f2a24;
    --muted:#8b8071;
    --accent:#5a4a8a;
    --accent-soft:#b9a8d8;
    --tint:#efe7f6;
    --tint-deep:#e2d6f0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 100% at 50% 0%, var(--bg1) 0%, var(--bg2) 100%);
    display:flex;align-items:center;justify-content:center;
    padding:28px 18px;overflow-x:hidden;
    transition:background .6s ease;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.32'/></svg>");
    mix-blend-mode:multiply;
  }
  .frame{width:100%;max-width:620px;position:relative;z-index:1}
  header{text-align:center;margin-bottom:20px;position:relative}
  h1{
    font-family:"Songti SC","SimSun",Georgia,serif;
    font-size:clamp(24px,5vw,36px);font-weight:700;
    letter-spacing:.2em;margin:0 0 6px;text-indent:.2em;
  }
  .sub{margin:0;font-size:12px;letter-spacing:.16em;color:var(--muted)}
  .head-actions{position:absolute;right:0;top:2px;display:flex;gap:8px;align-items:center}
  .pill{
    font-family:inherit;font-size:12px;letter-spacing:.08em;cursor:pointer;
    color:var(--muted);border:1px solid var(--paper-edge);background:var(--paper);
    padding:6px 12px;border-radius:999px;transition:.25s;text-decoration:none;
  }
  .pill:hover{color:var(--accent);border-color:var(--accent-soft)}
  .hidden{display:none !important}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;margin:2px 0 6px}
  .grid-item{
    background:var(--paper);border:1px solid var(--paper-edge);border-radius:8px;
    padding:10px;cursor:pointer;transition:.25s;
    box-shadow:0 6px 18px -12px rgba(70,55,35,.5);
  }
  .grid-item:hover{transform:translateY(-4px);border-color:var(--accent-soft);box-shadow:0 16px 28px -14px rgba(70,55,35,.62)}
  .grid-item .gi-cat{font-size:11px;letter-spacing:.14em;color:var(--muted)}
  .grid-item .gi-name{font-family:"Songti SC","SimSun",Georgia,serif;font-size:14px;margin:6px 0 0;letter-spacing:.08em}
  .grid-item.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(90,74,138,.18)}

  .stage{position:relative;perspective:1500px}
  .card{
    background:var(--paper);border:1px solid var(--paper-edge);
    border-radius:6px 14px 14px 6px;padding:26px 26px 22px;
    box-shadow:0 1px 0 #fff inset,22px 26px 60px -18px rgba(70,55,35,.42),0 2px 6px rgba(70,55,35,.10);
    position:relative;transform-style:preserve-3d;will-change:transform,opacity;
    min-height:430px;display:flex;flex-direction:column;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:16px;border-radius:6px 0 0 6px;
    background:linear-gradient(90deg, rgba(120,100,70,.20), rgba(120,100,70,0) 70%);pointer-events:none;
  }
  .cat-tag{
    align-self:flex-start;font-size:11px;letter-spacing:.2em;color:#fff;
    background:var(--accent);border-radius:999px;padding:4px 12px;margin-bottom:18px;
  }
  .swatch{
    flex:1;border-radius:10px;background:linear-gradient(150deg, var(--tint) 0%, var(--tint-deep) 100%);
    display:flex;align-items:center;justify-content:center;padding:22px;text-align:center;
  }
  .glyph{font-size:52px;line-height:1;filter:saturate(.85)}
  .title{
    font-family:"Songti SC","SimSun",Georgia,serif;
    font-size:clamp(22px,4.6vw,30px);margin:20px 0 8px;letter-spacing:.1em;
  }
  .desc{margin:0 0 6px;font-size:13.5px;color:#5f574c;letter-spacing:.06em;line-height:1.8}
  .madeby{margin:0 0 16px;font-size:11.5px;color:var(--muted);letter-spacing:.1em}
  .open{
    align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
    font-family:inherit;font-size:13px;letter-spacing:.1em;cursor:pointer;text-decoration:none;
    background:var(--accent);color:#fff;border:none;border-radius:999px;padding:11px 22px;transition:.25s;
  }
  .open:hover{filter:brightness(1.08);transform:translateY(-2px)}
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
    border:1px solid var(--paper-edge);background:rgba(251,247,239,.92);color:var(--ink);
    font-size:26px;line-height:1;cursor:pointer;box-shadow:0 6px 16px -6px rgba(70,55,35,.4);
    transition:.25s;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);
  }
  .nav:hover{background:#fff;color:var(--accent);border-color:var(--accent-soft);transform:translateY(-50%) scale(1.08)}
  .nav.prev{left:-22px}
  .nav.next{right:-22px}
  footer{margin-top:24px}
  .dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:14px}
  .dot{
    width:34px;height:34px;border-radius:50%;cursor:pointer;padding:0;
    border:1px solid var(--paper-edge);background:var(--tint);
    color:var(--accent);font-size:11px;transition:.25s;
  }
  .dot:hover{transform:translateY(-3px)}
  .dot.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(90,74,138,.2)}
  .controls{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
  .pager{font-size:12px;letter-spacing:.16em;color:var(--muted);font-variant-numeric:tabular-nums}
  .play{font-family:inherit;font-size:12px;letter-spacing:.14em;cursor:pointer;
    border:1px solid var(--paper-edge);background:var(--paper);color:var(--muted);
    padding:8px 18px;border-radius:999px;transition:.25s}
  .play:hover{border-color:var(--accent-soft);color:var(--accent)}
  .play.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .credit{margin-top:16px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em;line-height:1.7}
  .credit a{color:var(--muted)}
  @media (max-width:640px){
    .nav.prev{left:-6px}
    .nav.next{right:-6px}
    .card{padding:20px 18px 18px}
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>vibe coding</h1>
    <p class="sub">12 个用 AI 写出来的网页 · 第 11 卷</p>
    <div class="head-actions">
      <button class="pill" id="gridBtn" type="button">通览全部</button>
      <a class="pill" href="../_demos/complete-shelf/index.html">返回书架</a>
    </div>
  </header>

  <div class="grid hidden" id="grid"></div>

  <div class="stage" id="stage">
    <div class="card" id="card">
      <span class="cat-tag" id="cat"></span>
      <div class="swatch" id="swatch"><span class="glyph" id="glyph"></span></div>
      <h2 class="title" id="title"></h2>
      <p class="desc" id="desc"></p>
      <p class="madeby" id="madeby"></p>
      <a class="open" id="open" href="#" target="_blank" rel="noopener">打开作品 ↗</a>
    </div>
    <button class="nav prev" id="prev" aria-label="上一页">‹</button>
    <button class="nav next" id="next" aria-label="下一页">›</button>
  </div>

  <footer id="footerBar">
    <div class="dots" id="dots"></div>
    <div class="controls">
      <span class="pager" id="pager">01 / 12</span>
      <button class="play" id="play">自动翻页</button>
    </div>
    <p class="credit">
      作品选自 GitHub <a href="https://github.com/levz0r/awesome-vibecoded-apps" target="_blank" rel="noopener">levz0r/awesome-vibecoded-apps</a>（每周校验链接）<br>
      均为他人作品，点击卡片会在新标签打开原网站
    </p>
  </footer>
</div>

<script>
const WORKS = [
  {cat:"治愈", glyph:"🐟", title:"Draw a Fish", desc:"画一条鱼，放进所有人的共享鱼缸，看它和别人的鱼一起游。", madeby:"共享鱼缸 · 打开就能画", url:"https://drawafish.com", tint:"#e8f2e4", deep:"#d3e8cb", accent:"#4a7a3a"},
  {cat:"治愈", glyph:"🌿", title:"Kanso", desc:"在安静的场景里种活的数字化盆景——看着它慢慢长成一棵树。", madeby:"Codex + Claude 写成", url:"https://www.kansogame.com", tint:"#e8f2e4", deep:"#d3e8cb", accent:"#4a7a3a"},
  {cat:"治愈", glyph:"🦫", title:"水豚送外卖", desc:"慵懒的开放世界送外卖，车上的水果越堆越高、摇摇欲坠。Vibe Jam 2026 冠军。", madeby:"Claude Code 写成 · Vibe Jam 2026 冠军", url:"https://capybara-vibejam26.leocoout.dev", tint:"#e8f2e4", deep:"#d3e8cb", accent:"#4a7a3a"},
  {cat:"治愈", glyph:"⛵", title:"Vibe Sail", desc:"放松的多人 3D 帆船，出海、探索、运货，没人催你。", madeby:"多人在线 · 打开就能开船", url:"https://vibesail.com", tint:"#e8f2e4", deep:"#d3e8cb", accent:"#4a7a3a"},
  {cat:"视觉", glyph:"🗽", title:"isometric.nyc", desc:"一张巨大的等距像素纽约地图，全部由编码智能体生成，零手写代码。", madeby:"零手写代码 · 可缩放浏览", url:"https://isometric.nyc", tint:"#efe7f6", deep:"#ddd0ef", accent:"#5a4a8a"},
  {cat:"视觉", glyph:"🌀", title:"Nebula", desc:"浏览器里实时渲染的 4D 分形探索器，靠 WebGPU 跑起来。", madeby:"WebGPU 实时渲染", url:"https://bryanjj.github.io/nebula/", tint:"#efe7f6", deep:"#ddd0ef", accent:"#5a4a8a"},
  {cat:"视觉", glyph:"💌", title:"Mixcard", desc:"把 Spotify 歌单变成可打印的复古明信片，还带二维码。", madeby:"连 Spotify 账号即可生成", url:"https://mixcard.me", tint:"#efe7f6", deep:"#ddd0ef", accent:"#5a4a8a"},
  {cat:"视觉", glyph:"🧩", title:"Jigsaw Haiku", desc:"每天一幅拼图，拼完露出一首俳句——每天只给一首。", madeby:"Claude 写成 · 每日更新", url:"https://jigsawhaiku.com", tint:"#efe7f6", deep:"#ddd0ef", accent:"#5a4a8a"},
  {cat:"有意思", glyph:"📚", title:"Babel Life", desc:"博尔赫斯的巴别图书馆：81 本书，每一本都是一段完整的人生。", madeby:"双语阅读 · 文学实验", url:"https://babel-life.netlify.app", tint:"#fbeae0", deep:"#f2d8c8", accent:"#a85a2a"},
  {cat:"有意思", glyph:"🧠", title:"braincell.lol", desc:"一个号称有百万脑细胞的 AI，但它只知道陌生人花钱告诉它的事。", madeby:"越聊越怪 · 社区投喂", url:"https://braincell.lol", tint:"#fbeae0", deep:"#f2d8c8", accent:"#a85a2a"},
  {cat:"有意思", glyph:"📰", title:"DOOMscroll", desc:"DOOM 风格的游戏，唯一的操作是滚动，敌人是真实的纽约时报标题。", madeby:"讽刺向 · 滚动即射击", url:"https://gisnep.com/doomscroll", tint:"#fbeae0", deep:"#f2d8c8", accent:"#a85a2a"},
  {cat:"有意思", glyph:"🍽️", title:"MenuGen", desc:"拍下餐厅菜单，给每一道菜生成一张图——Andrej Karpathy 本人做的。", madeby:"Karpathy 作品 · 拍照即可", url:"https://www.menugen.app", tint:"#fbeae0", deep:"#f2d8c8", accent:"#a85a2a"}
];
const N = WORKS.length;
const card = document.getElementById("card");
const grid = document.getElementById("grid");
const gridBtn = document.getElementById("gridBtn");
const footerBar = document.getElementById("footerBar");
const catEl = document.getElementById("cat");
const glyphEl = document.getElementById("glyph");
const titleEl = document.getElementById("title");
const descEl = document.getElementById("desc");
const madebyEl = document.getElementById("madeby");
const openEl = document.getElementById("open");
const pager = document.getElementById("pager");
const dotsBox = document.getElementById("dots");
const playBtn = document.getElementById("play");
let idx = 0, busy = false, timer = null, gridMode = false;

WORKS.forEach((w, i) => {
  const d = document.createElement("button");
  d.className = "dot";
  d.title = w.title;
  d.textContent = String(i + 1).padStart(2, "0");
  d.addEventListener("click", () => goTo(i));
  dotsBox.appendChild(d);

  const g = document.createElement("div");
  g.className = "grid-item";
  g.style.background = w.tint;
  g.innerHTML = `<div class="gi-cat" style="color:${w.accent}">${w.cat}</div><div class="gi-name">${w.title}</div>`;
  g.addEventListener("click", () => { if (gridMode) toggleGrid(); goTo(i); });
  grid.appendChild(g);
});
const dots = [...dotsBox.children];
const gitems = [...grid.children];

function paint() {
  const w = WORKS[idx];
  document.documentElement.style.setProperty("--tint", w.tint);
  document.documentElement.style.setProperty("--tint-deep", w.deep);
  document.documentElement.style.setProperty("--accent", w.accent);
  catEl.textContent = w.cat;
  glyphEl.textContent = w.glyph;
  titleEl.textContent = w.title;
  descEl.textContent = w.desc;
  madebyEl.textContent = w.madeby;
  openEl.href = w.url;
  pager.textContent = `${String(idx + 1).padStart(2, "0")} / ${String(N).padStart(2, "0")}`;
  dots.forEach((d, i) => d.classList.toggle("active", i === idx));
  gitems.forEach((g, i) => g.classList.toggle("active", i === idx));
}

function turn(dir) {
  if (busy) return;
  busy = true;
  const outRot = dir > 0 ? -26 : 26;
  const outTx = dir > 0 ? -54 : 54;
  card.style.transition = "transform .3s cubic-bezier(.4,0,1,1), opacity .3s ease-in";
  card.style.opacity = "0";
  card.style.transform = `perspective(1500px) rotateY(${outRot}deg) translateX(${outTx}px)`;
  setTimeout(() => {
    idx = (idx + dir + N) % N;
    paint();
    card.style.transform = `perspective(1500px) rotateY(${-outRot * .85}deg) translateX(${-outTx * .75}px)`;
    requestAnimationFrame(() => {
      card.style.transition = "transform .5s cubic-bezier(.16,.84,.24,1), opacity .45s ease-out";
      card.style.opacity = "1";
      card.style.transform = "perspective(1500px) rotateY(0deg) translateX(0)";
      setTimeout(() => { busy = false; }, 500);
    });
  }, 305);
}

function goTo(target) {
  if (busy || target === idx) return;
  const dir = target > idx ? 1 : -1;
  turn(dir);
  idx = (target - dir + N) % N;
}

function toggleGrid() {
  gridMode = !gridMode;
  grid.classList.toggle("hidden", !gridMode);
  document.getElementById("stage").classList.toggle("hidden", gridMode);
  footerBar.classList.toggle("hidden", gridMode);
  gridBtn.textContent = gridMode ? "回到书页" : "通览全部";
  if (gridMode) paint();
}
gridBtn.addEventListener("click", toggleGrid);

function setPlay(on) {
  if (on) {
    playBtn.classList.add("on");
    playBtn.textContent = "暂停翻页";
    timer = setInterval(() => turn(1), 5000);
  } else {
    playBtn.classList.remove("on");
    playBtn.textContent = "自动翻页";
    clearInterval(timer); timer = null;
  }
}
document.getElementById("prev").addEventListener("click", () => turn(-1));
document.getElementById("next").addEventListener("click", () => turn(1));
playBtn.addEventListener("click", () => setPlay(!timer));
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") turn(-1);
  else if (e.key === "ArrowRight") turn(1);
  else if (e.key === " ") { e.preventDefault(); setPlay(!timer); }
});
let sx = 0, sy = 0;
const stage = document.getElementById("stage");
stage.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
stage.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy)) turn(dx < 0 ? 1 : -1);
}, { passive: true });

paint();
if (location.search.indexOf('grid') >= 0) toggleGrid();
</script>
</body>
</html>

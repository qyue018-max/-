<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>启航 · Luma 互动学习空间</title>
<style>
  :root {
    --navy: #16264f;
    --navy-deep: #0c1730;
    --gold: #f2c54c;
    --pale: #f7f4e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--navy-deep); }
  body {
    display: flex;
    flex-direction: column;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    color: var(--pale);
  }
  .qh-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    height: 54px;
    padding: 0 18px;
    background: linear-gradient(90deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-bottom: 1px solid rgba(242, 197, 76, 0.35);
  }
  .qh-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--pale);
  }
  .qh-sub {
    font-size: 12px;
    letter-spacing: 1px;
    color: rgba(247, 244, 232, 0.62);
  }
  .qh-spacer { flex: 1 1 auto; }
  .qh-open {
    font-size: 13px;
    color: var(--navy-deep);
    background: var(--gold);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
    font-weight: 600;
  }
  .qh-open:hover { filter: brightness(1.06); }
  .qh-frame-wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }
  .qh-fallback {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 24px;
    background: var(--navy-deep);
  }
  .qh-fallback.show { display: flex; }
  .qh-fallback p { max-width: 420px; line-height: 1.7; color: rgba(247,244,232,0.8); }
</style>
</head>
<body>
  <div class="qh-bar">
    <span class="qh-title">启航</span>
    <span class="qh-sub">Luma · 互动学习空间 · 雅思词汇 · 文献研读</span>
    <span class="qh-spacer"></span>
    <a class="qh-open" href="https://zieng-7111.github.io/luma-learning-site/" target="_blank" rel="noopener">↗ 新标签打开</a>
  </div>
  <div class="qh-frame-wrap">
    <iframe
      id="luma"
      src="https://zieng-7111.github.io/luma-learning-site/"
      title="Luma 互动学习空间"
      allow="fullscreen"
      referrerpolicy="no-referrer"></iframe>
    <div class="qh-fallback" id="fallback">
      <p>学习站加载有点慢或暂时连不上（它放在 GitHub 上，国内网络时快时慢）。<br/>可以稍等片刻，或点右上角「新标签打开」直接访问。</p>
    </div>
  </div>
  <script>
    // 检测 iframe 是否真的加载成功：
    // 跨域站点加载成功时也会触发 iframe 的 load 事件 —— 用它作为成功信号。
    // 只在「超时都没 load」时才显示兜底（比如断网 / GitHub Pages 访问慢）。
    var iframe = document.getElementById("luma");
    var loaded = false;
    var fallback = document.getElementById("fallback");
    var timer = setTimeout(function () {
      if (!loaded && fallback) fallback.classList.add("show");
    }, 15000);
    iframe.addEventListener("load", function () {
      loaded = true;
      clearTimeout(timer);
      if (fallback) fallback.classList.remove("show");
    });
  </script>
</body>
</html>
